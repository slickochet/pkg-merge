
name: Build PKG Merge for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Release build
        run: cmake -S . -B build -A x64

      - name: Compile Release executable
        run: cmake --build build --config Release --parallel

      - name: Locate executable
        shell: pwsh
        run: |
          Get-ChildItem -Path build -Filter pkg_merge.exe -Recurse |
            Select-Object FullName

      - name: Package executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Filter pkg_merge.exe -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "pkg_merge.exe was not produced"
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe.FullName dist/pkg-merge.exe

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: pkg-merge-windows-x64
          path: dist/pkg-merge.exe
          if-no-files-found: error
